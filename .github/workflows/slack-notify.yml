# Post repository activity to Slack.
#
# Deliberately posts TITLE, AUTHOR and LINK only — never the issue body. Issues
# filed through the MCP's report_problem carry drawing numbers, bounding boxes
# and row counts, and the channel this lands in is shared with a client. Anyone
# who needs the detail can follow the link; nobody needs it pushed at them.
#
# Needs one repository secret:
#   SLACK_WEBHOOK_URL — an incoming-webhook URL for the target channel
#   Settings → Secrets and variables → Actions → New repository secret
#
# Without that secret every run exits quietly, so this file is inert until you
# add it and nothing goes red in the meantime.
name: Slack notify

on:
  issues:
    types: [opened, closed, reopened]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Compose and send
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REL_NAME: ${{ github.event.release.name }}
          REL_URL: ${{ github.event.release.html_url }}
          COMPARE: ${{ github.event.compare }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "SLACK_WEBHOOK_URL is not set — nothing to do."
            exit 0
          fi

          # Check the shape before using it, and say so without ever echoing it.
          # A wrong value used to surface as bare "exit code 3" (curl: malformed
          # URL) with no output at all, because `bash -e` aborts on the failing
          # command substitution before the diagnostic line runs.
          case "$HOOK" in
            https://hooks.slack.com/services/*) ;;
            *)
              echo "::error::SLACK_WEBHOOK_URL does not look like a Slack incoming webhook."
              echo "Expected it to start with https://hooks.slack.com/services/"
              echo "Length of the stored value: ${#HOOK} characters."
              echo "Re-copy the webhook from api.slack.com -> your app -> Incoming Webhooks,"
              echo "then:  pbpaste | gh secret set SLACK_WEBHOOK_URL --repo $REPO"
              exit 1 ;;
          esac

          case "$EVENT" in
            issues)
              case "$ACTION" in
                opened)   VERB=":inbox_tray: New issue" ;;
                closed)   VERB=":white_check_mark: Closed" ;;
                reopened) VERB=":arrows_counterclockwise: Reopened" ;;
              esac
              TEXT="$VERB in \`$REPO\` by \`$ACTOR\`\n<$ISSUE_URL|#$ISSUE_NUM — $ISSUE_TITLE>"
              ;;
            push)
              SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -1)
              TEXT=":arrow_up: Push to \`$REPO\` main by \`$ACTOR\`\n<$COMPARE|$SUBJECT>"
              ;;
            release)
              TEXT=":label: Release \`$REL_NAME\` in \`$REPO\`\n<$REL_URL|Release notes>"
              ;;
            *)
              echo "Unhandled event $EVENT"; exit 0 ;;
          esac

          # jq builds the JSON so a quote or backtick in a title cannot break it.
          jq -n --arg t "$TEXT" '{text: $t, mrkdwn: true}' > payload.json

          # Do not let curl's own exit status abort the step under `bash -e`,
          # or the failure arrives as a number with no explanation.
          set +e
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
                   -H 'Content-Type: application/json' \
                   --data @payload.json "$HOOK" 2>curlerr.txt)
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then
            echo "::error::curl failed (exit $rc): $(cat curlerr.txt)"
            exit 1
          fi
          echo "Slack responded $code: $(cat resp.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Slack rejected the post. 'invalid_token' or 404 means the"
            echo "webhook was revoked or belongs to a deleted app; re-create it."
            exit 1
          fi
